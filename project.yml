name: Neuralyzer
options:
  bundleIdPrefix: com.shivvyas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  NeuralyzerKit:
    path: NeuralyzerKit
  NeuralyzerPhoneKit:
    path: iOS/NeuralyzerPhoneKit
targets:
  Neuralyzer:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: NeuralyzerKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Neuralyzer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: Copyright 2026 Shiv Vyas
    entitlements:
      path: App/Neuralyzer.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.neuralyzer
        PRODUCT_NAME: Neuralyzer
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: Z42YU5W6WY
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  NeuralyzerPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [iOS/App]
    dependencies:
      - package: NeuralyzerPhoneKit
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Neuralyzer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Neuralyzer looks for duplicate and unneeded photos so you can delete them.
        NSContactsUsageDescription: Neuralyzer looks for duplicate contacts so you can merge them.
        UIFileSharingEnabled: true
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.neuralyzer.ios
        PRODUCT_NAME: Neuralyzer
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: Z42YU5W6WY
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
